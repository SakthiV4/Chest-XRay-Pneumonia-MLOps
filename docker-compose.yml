version: "3.9"

services:
  # ── React Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: pneumonia_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8000
    restart: unless-stopped

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: pneumonia_backend
    ports:
      - "8000:8000"
    depends_on:
      - triton
    env_file:
      - .env
    environment:
      - TRITON_URL=triton:8000
    restart: unless-stopped

  # ── NVIDIA Triton Inference Server ──────────────────────────
  triton:
    image: nvcr.io/nvidia/tritonserver:23.10-py3
    container_name: pneumonia_triton
    ports:
      - "8001:8000"   # HTTP
      - "8002:8001"   # gRPC
      - "8003:8002"   # Metrics
    volumes:
      - ./triton/model_repository:/models
    command: tritonserver --model-repository=/models --log-verbose=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  default:
    name: pneumonia_net
